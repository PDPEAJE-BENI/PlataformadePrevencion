        <script>
            function updateIdiomaBtnSelected(lang) {
                document.getElementById('btn-es').classList.toggle('selected', lang === 'es');
                document.getElementById('btn-en').classList.toggle('selected', lang === 'en');
            }
            window.setLanguage = function (lang) {
                setLanguage(lang);
                updateIdiomaBtnSelected(lang);
                localStorage.setItem('lang', lang);
            };
            document.addEventListener('DOMContentLoaded', function () {
                const lang = localStorage.getItem('lang') || 'es';
                updateIdiomaBtnSelected(lang);
            });
        </script>

        // Menú desplegable responsivo (igual en todos los HTML)
        function toggleMenu() {
            var menu = document.getElementById('menu-contenido');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }
        window.onclick = function(event) {
            if (!event.target.matches('.menu-boton')) {
                var menu = document.getElementById('menu-contenido');
                if (menu && menu.style.display === 'block') {
                    menu.style.display = 'none';
                }
            }
        }

                    { texto: 'Acepta el desafío', siguiente: 'finales', accion: function () { personaje.stats.determinacion += 10; actualizarStats(); } },
                    { texto: 'Rechaza por motivos personales', siguiente: 'finales', accion: function () { personaje.stats.felicidad += 5; actualizarStats(); } },
                    { texto: 'Consulta con su familia', siguiente: 'finales', accion: function () { personaje.stats.autoestima += 5; actualizarStats(); } },
                    { texto: 'Investiga sobre el país', siguiente: 'finales', accion: function () { personaje.stats.salud += 5; actualizarStats(); } }
                ]
            },
            // --- FINALES ---
            finales: {
                texto: function () {
                    let mensaje = `${personaje.nombre} ha recorrido un largo camino. Ha aprendido sobre sí mismo/a, sobre la importancia de la familia, la amistad, la salud mental y la perseverancia.\n\n`;
                    if (personaje.stats.determinacion > 80) mensaje += 'Su determinación le permitió alcanzar grandes metas.\n';
                    if (personaje.stats.felicidad > 80) mensaje += 'La felicidad fue su motor y supo disfrutar cada etapa.\n';
                    if (personaje.stats.salud > 80) mensaje += 'Cuidar su salud le dio energía para avanzar.\n';
                    if (personaje.stats.autoestima > 80) mensaje += 'La autoestima le permitió superar obstáculos y creer en sí mismo/a.\n';
                    mensaje += '\nRecuerda: cada vida es única y cada decisión nos enseña algo valioso.';
                    return mensaje;
                },
                opciones: [
                    { texto: 'Volver al inicio', siguiente: 'inicio' },
                    { texto: 'Reflexionar sobre el viaje', siguiente: 'reflexion_final' },
                    { texto: 'Crear un nuevo personaje', siguiente: 'crear_personaje' },
                    { texto: 'Salir', siguiente: 'inicio' }
                ]
            },
            reflexion_final: {
                texto: 'La vida está llena de decisiones, retos y aprendizajes. Lo importante es avanzar con empatía, respeto y amor propio. ¡Gracias por jugar!',
                opciones: [
                    { texto: 'Volver al inicio', siguiente: 'inicio' },
                    { texto: 'Crear un nuevo personaje', siguiente: 'crear_personaje' },
                    { texto: 'Salir', siguiente: 'inicio' },
                    { texto: 'Jugar de nuevo', siguiente: 'inicio' }
                ]
            }
        };

        function actualizarStats() {
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `
                <div>Felicidad: ${personaje.stats.felicidad}</div>
                <div>Determinación: ${personaje.stats.determinacion}</div>
                <div>Suerte: ${personaje.stats.suerte}</div>
            `;
        }

        function mostrarNodoHistoria(nodoId) {
            let nodo;

            if (typeof nodoId === 'function') {
                nodo = historiaNodos[nodoId()];
            } else {
                nodo = historiaNodos[nodoId];
            }

            const texto = typeof nodo.texto === 'function' ? nodo.texto() : nodo.texto;
            const final = nodo.final && typeof nodo.final === 'function' ? nodo.final() : nodo.final || '';

            document.getElementById('historia-texto').innerHTML = texto;
            document.getElementById('historia-final').textContent = final;

            const opcionesDiv = document.getElementById('historia-opciones');
            opcionesDiv.innerHTML = '';

            nodo.opciones.forEach((op) => {
                const btn = document.createElement('button');
                btn.textContent = op.texto;
                btn.onclick = function () {
                    if (op.accion) op.accion();
                    if (typeof op.siguiente === 'function') {
                        mostrarNodoHistoria(op.siguiente);
                    } else {
                        mostrarNodoHistoria(op.siguiente);
                    }
                };
                opcionesDiv.appendChild(btn);
            });
        }

        // Iniciar historia al cargar
        window.onload = function () {
            mostrarNodoHistoria('inicio');
        };
    </script>
</body>
